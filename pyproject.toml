[project]
name = "nlp-tutorial"
version = "0.1.0"
description = "Batch scoring and evaluation for the T4 OCR and translation practicum"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.8,<2.15", "transformers>=4.52,<5"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu126/"
explicit = true

[[tool.uv.index]]
name = "pypi-tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
