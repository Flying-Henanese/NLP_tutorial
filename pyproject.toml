[project]
name = "nlp-tutorial"
version = "0.1.0"
description = "Batch scoring and evaluation for the T4 translation quality practicum"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
gpu = ["torch==2.8.0", "transformers>=5.2,<6"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
